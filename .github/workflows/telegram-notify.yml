name: Telegram'ga yangi arizalarni yuborish

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r scripts/requirements.txt

      - name: Arizalarni tekshirish va yuborish
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/notify_telegram.py

      - name: "Bog'landim / Bajarildi / Sharh tugmalarini qayta ishlash"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/telegram_callbacks.py

      - name: "Yangi sharhlarni tasdiqlash uchun yuborish"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/review_notify.py

      - name: "Unutilgan (javobsiz) arizalar uchun eslatma"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/stale_reminder.py

      - name: Kunlik hisobot
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/daily_report.py

      - name: Haftalik hisobot
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/weekly_report.py

      - name: Oylik hisobot
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/monthly_report.py

      - name: Ma'lumotlar zaxira nusxasi (backup)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
          TELEGRAM_TOPICS_JSON: ${{ secrets.TELEGRAM_TOPICS_JSON }}
        run: python scripts/backup_firestore.py
