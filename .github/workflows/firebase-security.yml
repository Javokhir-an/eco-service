name: Firebase xavfsizligi

# Qo'lda: audit (faqat ko'rish) | fix (ro'yxatdan o'tishni yopish + test telefon)
#         test (qoidalarni emulyatorda sinash) | rules (sinab, keyin Firebase'ga joylash)
# Avtomatik: firestore.rules o'zgarib main'ga push qilinsa — sinov, o'tsa joylash.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit | fix | test | rules"
        required: true
        default: audit
  push:
    branches: [main]
    paths: [firestore.rules]

jobs:
  rules-test:
    if: github.event_name == 'push' || inputs.mode == 'test' || inputs.mode == 'rules'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Kutubxonalar
        run: npm install --no-save --no-audit --no-fund firebase-tools@15.31.0 firebase@10.14.1 @firebase/rules-unit-testing@3.0.4

      - name: Qoidalarni emulyatorda sinash
        run: npx firebase emulators:exec --only firestore --project demo-itexnika "node scripts/rules_test.mjs"

  run:
    needs: rules-test
    if: ${{ !cancelled() && inputs.mode != 'test' && (needs.rules-test.result == 'success' || needs.rules-test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalar
        run: pip install requests==2.32.3 google-auth==2.35.0

      - name: Ishga tushirish
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ github.event_name == 'push' && 'rules' || inputs.mode }}
        run: python scripts/security_fix.py
